name: Mobile UI self-check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate source and data
        run: |
          node --check app.js
          python -m py_compile tools/scrape_future.py
          for KEY in veteran zealot psyker ogryn arbites skitarii hivescum hivescum-stimm; do
            grep -q "\"key\":\"$KEY\"" tree-data.js
          done
          ICONS=$(grep -o 'data:image/webp;base64' tree-data.js | wc -l)
          echo "Embedded icons: $ICONS"
          test "$ICONS" -ge 600

      - name: Start local site
        run: |
          python -m http.server 8000 >/tmp/darktide-http.log 2>&1 &
          sleep 2

      - name: Run mobile interaction test in headless Chrome
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --window-size=430,932 --virtual-time-budget=9000 --dump-dom 'http://127.0.0.1:8000/?selftest=1' > /tmp/dom.html

      - name: Assert editor behavior
        run: |
          check() {
            LABEL="$1"
            PATTERN="$2"
            if grep -q "$PATTERN" /tmp/dom.html; then
              echo "PASS: $LABEL"
            else
              echo "FAIL: $LABEL ($PATTERN)"
              grep -o 'data-selftest[^ >]*' /tmp/dom.html || true
              exit 1
            fi
          }
          check "automated interaction test" 'data-selftest="pass"'
          check "Stimm Lab English UI" 'Stimm Lab'
          check "melee editor" 'id="meleeWeapon"'
          check "ranged editor" 'id="rangedWeapon"'
          check "curio editor" 'id="curio1Main"'
          check "node popover" 'id="nodePopover"'
          check "embedded talent art" 'class="art"'
          COUNT=$(grep -o 'data-s=' /tmp/dom.html | wc -l)
          echo "Rendered nodes after self-test: $COUNT"
          test "$COUNT" -ge 20

      - name: Capture normal mobile screenshot
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --window-size=430,1800 --virtual-time-budget=7000 --screenshot=/tmp/darktide-mobile.png 'http://127.0.0.1:8000/'

      - name: Capture open-popover geometry and screenshot
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --window-size=430,1800 --virtual-time-budget=7000 --dump-dom 'http://127.0.0.1:8000/?visual=popover' > /tmp/popover-dom.html
          google-chrome --headless --no-sandbox --disable-gpu --window-size=430,1800 --virtual-time-budget=7000 --screenshot=/tmp/darktide-popover.png 'http://127.0.0.1:8000/?visual=popover'

      - name: Check open-popover geometry
        run: |
          grep -q 'data-visual-test-started="true"' /tmp/popover-dom.html
          grep -q 'data-visual-test-done="true"' /tmp/popover-dom.html
          grep -q 'data-popover-inside-x="true"' /tmp/popover-dom.html
          grep -q 'data-popover-inside-y="true"' /tmp/popover-dom.html
          grep -q 'data-popover-relation="true"' /tmp/popover-dom.html
          ERR=$(grep -o 'data-popover-x-error="[0-9]*"' /tmp/popover-dom.html | head -1 | grep -o '[0-9]*')
          SHIFT=$(grep -o 'data-tree-shift="[0-9]*"' /tmp/popover-dom.html | head -1 | grep -o '[0-9]*')
          SIDE=$(grep -o 'data-popover-side="[^"]*"' /tmp/popover-dom.html | head -1)
          GEOM=$(grep -o 'data-visual-width="[^"]*"\|data-visual-height="[^"]*"\|data-popover-left="[^"]*"\|data-popover-right="[^"]*"\|data-popover-top="[^"]*"\|data-popover-bottom="[^"]*"\|data-header-bottom="[^"]*"' /tmp/popover-dom.html | tr '\n' ' ')
          echo "Popover arrow alignment error: ${ERR}px"
          echo "Tree movement after opening popover: ${SHIFT}px"
          echo "${SIDE}"
          echo "${GEOM}"
          test -n "$ERR"
          test -n "$SHIFT"
          test "$ERR" -le 12
          test "$SHIFT" -le 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darktide-mobile-smoke-test
          path: |
            /tmp/darktide-mobile.png
            /tmp/darktide-popover.png
            /tmp/dom.html
            /tmp/popover-dom.html
