name: Mobile UI self-check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate source syntax
        run: |
          node --check app.js
          python -m py_compile tools/scrape_future.py

      - name: Start local site
        run: |
          python -m http.server 8000 >/tmp/darktide-http.log 2>&1 &
          sleep 2

      - name: Render site in headless Chrome
        run: |
          google-chrome --headless --no-sandbox --disable-gpu             --window-size=430,932             --virtual-time-budget=6000             --dump-dom http://127.0.0.1:8000/ > /tmp/dom.html

      - name: Assert visual tree booted
        run: |
          grep -q "Depths of the Damned Future update" /tmp/dom.html
          grep -q 'class="node active' /tmp/dom.html
          grep -q 'class="art"' /tmp/dom.html
          grep -q '老兵' /tmp/dom.html
          grep -q 'Veteran' /tmp/dom.html
          COUNT=$(grep -o 'data-s=' /tmp/dom.html | wc -l)
          echo "Rendered talent nodes: $COUNT"
          test "$COUNT" -ge 60

      - name: Capture mobile screenshot
        run: |
          google-chrome --headless --no-sandbox --disable-gpu             --window-size=430,1600             --virtual-time-budget=6000             --screenshot=/tmp/darktide-mobile.png             http://127.0.0.1:8000/

      - uses: actions/upload-artifact@v4
        with:
          name: darktide-mobile-smoke-test
          path: |
            /tmp/darktide-mobile.png
            /tmp/dom.html
