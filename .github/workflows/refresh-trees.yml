name: Refresh future talent trees

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/scrape_future.py"
      - ".github/workflows/refresh-trees.yml"
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter
        run: pip install opencc-python-reimplemented
      - name: Scrape Games Lantern future trees
        run: python tools/scrape_future.py
      - name: Commit refreshed tree data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tree-data.js
          git diff --cached --quiet || git commit -m "Refresh Depths of the Damned talent trees"
          git push
