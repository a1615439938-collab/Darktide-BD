name: Refresh future talent trees

# Repository policy: do NOT add a GitHub Actions schedule/cron trigger here.
# Scheduled GitHub Actions are intentionally forbidden for this repository.
# Keep refreshes manual (workflow_dispatch) or event-driven only.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/scrape_future.py"
      - "tools/enhanced_zh.py"
      - "tools/manual_zh.json"
      - "tools/manual_current_cn.json"
      - "tools/split_tree_data.py"
      - ".github/workflows/refresh-trees.yml"

permissions:
  contents: write

concurrency:
  group: refresh-talent-trees
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter
        run: pip install opencc-python-reimplemented

      - name: Generate talent artifacts once
        run: |
          git fetch origin main
          git reset --hard origin/main
          python tools/scrape_future.py
          python tools/split_tree_data.py
          mkdir -p /tmp/darktide-generated
          cp tree-data.js tree-core.js tree-icons.js tree-icons-*.js /tmp/darktide-generated/

      - name: Commit refreshed tree data without re-scraping
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ATTEMPT in 1 2 3 4 5; do
            echo "Push attempt $ATTEMPT"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/darktide-generated/tree-data.js .
            cp /tmp/darktide-generated/tree-core.js .
            cp /tmp/darktide-generated/tree-icons.js .
            cp /tmp/darktide-generated/tree-icons-*.js .
            git add tree-data.js tree-core.js tree-icons.js tree-icons-*.js

            if git diff --cached --quiet; then
              echo "Latest main already contains the generated talent data"
              exit 0
            fi

            git commit -m "Refresh Depths of the Damned talent trees"
            if git push origin HEAD:main; then
              echo "Talent data pushed successfully"
              exit 0
            fi

            echo "main changed during push; retrying the same generated artifacts on latest main"
            sleep $((ATTEMPT * 2))
          done

          echo "Failed to push generated talent data after 5 attempts"
          exit 1
